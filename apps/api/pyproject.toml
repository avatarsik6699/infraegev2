[project]
name = "infraege-api"
version = "0.1.0"
description = "infraege backend — practice checker API (docs/SPEC.md §4)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "structlog>=24.1",
  "sqlalchemy[asyncio]==2.0.52",
  "alembic==1.20.0",
  "asyncpg==0.31.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8.3",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["app", "tests", "migrations"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

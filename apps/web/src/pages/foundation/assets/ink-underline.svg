<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 28" preserveAspectRatio="none">
  <defs>
    <filter id="torn" x="-4%" y="-40%" width="108%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.35" numOctaves="1" seed="7" result="wobble"/>
      <feDisplacementMap in="SourceGraphic" in2="wobble" scale="4" xChannelSelector="R" yChannelSelector="G" result="bent"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="grain"/>
      <feDisplacementMap in="bent" in2="grain" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="fade">
      <stop offset=".35" stop-color="#fff"/>
      <stop offset=".9" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="bristle" x="0" y="0" width="100%" height="100%">

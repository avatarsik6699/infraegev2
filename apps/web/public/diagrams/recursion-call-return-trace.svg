<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" role="img" aria-labelledby="title description">
  <title id="title">Спуск к базовому случаю и обратный возврат значений</title>
  <desc id="description">Вызов F(5) последовательно вызывает F(4), F(3), F(2) и F(1), после чего значения 1, 3, 7, 15 и 31 возвращаются в обратном порядке.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
    <style>
      .heading { font: 600 24px ui-sans-serif, system-ui, sans-serif; fill: #171717; }
      .label { font: 600 17px ui-sans-serif, system-ui, sans-serif; fill: #525252; letter-spacing: .04em; }
      .formula { font: 500 20px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #171717; }
      .note { font: 400 16px ui-sans-serif, system-ui, sans-serif; fill: #737373; }
      .box { fill: #fafafa; stroke: #d4d4d4; stroke-width: 2; }
      .base { fill: #f5f5f5; stroke: #737373; stroke-width: 2; }
      .line { fill: none; stroke: #737373; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="880" height="700" rx="24" fill="#ffffff"/>
  <text x="440" y="50" text-anchor="middle" class="heading">F(n) = 2 · F(n − 1) + 1</text>
  <text x="205" y="96" text-anchor="middle" class="label">СПУСК: ИЩЕМ БАЗУ</text>
  <text x="675" y="96" text-anchor="middle" class="label">ВОЗВРАТ: СЧИТАЕМ</text>

  <rect x="72" y="125" width="266" height="64" rx="16" class="box"/>
  <text x="205" y="165" text-anchor="middle" class="formula">F(5) → F(4)</text>
  <path d="M205 189 V225" class="line"/>
  <rect x="72" y="230" width="266" height="64" rx="16" class="box"/>
  <text x="205" y="270" text-anchor="middle" class="formula">F(4) → F(3)</text>
  <path d="M205 294 V330" class="line"/>
  <rect x="72" y="335" width="266" height="64" rx="16" class="box"/>
  <text x="205" y="375" text-anchor="middle" class="formula">F(3) → F(2)</text>
  <path d="M205 399 V435" class="line"/>
  <rect x="72" y="440" width="266" height="64" rx="16" class="box"/>
  <text x="205" y="480" text-anchor="middle" class="formula">F(2) → F(1)</text>
  <path d="M205 504 C205 552 268 570 346 570" class="line"/>

  <rect x="345" y="538" width="190" height="64" rx="18" class="base"/>
  <text x="440" y="578" text-anchor="middle" class="formula">F(1) = 1</text>
  <text x="440" y="632" text-anchor="middle" class="note">базовый случай останавливает спуск</text>

  <path d="M534 570 C612 570 675 552 675 504" class="line"/>
  <rect x="542" y="440" width="266" height="64" rx="16" class="box"/>
  <text x="675" y="480" text-anchor="middle" class="formula">F(2) = 3</text>
  <text x="820" y="478" class="note">2 · 1 + 1</text>
  <path d="M675 440 V404" class="line"/>
  <rect x="542" y="335" width="266" height="64" rx="16" class="box"/>
  <text x="675" y="375" text-anchor="middle" class="formula">F(3) = 7</text>
  <text x="820" y="373" class="note">2 · 3 + 1</text>
  <path d="M675 335 V299" class="line"/>
  <rect x="542" y="230" width="266" height="64" rx="16" class="box"/>
  <text x="675" y="270" text-anchor="middle" class="formula">F(4) = 15</text>
  <text x="820" y="268" class="note">2 · 7 + 1</text>
  <path d="M675 230 V194" class="line"/>
  <rect x="542" y="125" width="266" height="64" rx="16" class="base"/>
  <text x="675" y="165" text-anchor="middle" class="formula">F(5) = 31</text>
</svg>

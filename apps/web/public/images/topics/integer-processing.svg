<svg xmlns="http://www.w3.org/2000/svg" width="144" height="88" viewBox="0 0 144 88" fill="none" aria-hidden="true">
  <desc>Числа от 1 до 10: 2, 3, 5 и 7 простые; 4, 6, 8, 9 и 10 составные. Единица не относится ни к одной группе. Стрелки ведут от простых чисел к некоторым их кратным.</desc>
  <g stroke="#090b0c" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">

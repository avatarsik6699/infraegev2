  <g fill="#090b0c" font-family="Georgia, 'Times New Roman', serif" font-size="11" text-anchor="middle">
    <text x="9" y="41">1</text><text x="21" y="41">2</text><text x="33" y="41">3</text><text x="45" y="41">4</text><text x="57" y="41">5</text>
    <text x="69" y="41">6</text><text x="81" y="41">7</text><text x="93" y="41">8</text><text x="105" y="41">9</text><text x="117" y="41" font-size="10">10</text>
    <text x="135" y="41" font-size="15">…</text>
  </g>
  <rect x="4.5" y="55.5" width="8" height="8" fill="#e6ecf1" stroke="#959ba1" />

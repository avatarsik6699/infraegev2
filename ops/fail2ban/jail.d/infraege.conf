[DEFAULT]
banaction = ufw
bantime = 1h
findtime = 10m
maxretry = 5
# Password SSH stays by architect decision (SPEC 7.1); repeat offenders get longer bans instead.
bantime.increment = true
bantime.maxtime = 1w

[sshd]
enabled = true
backend = systemd
maxretry = 5

[infraege-nginx-limit]
enabled = true
backend = systemd
filter = infraege-nginx-limit
# Change 198: Nginx runs in Docker; published ports bypass UFW's input rules, so a UFW ban
# never reaches it. DOCKER-USER is the chain Docker consults before forwarding to containers.
# Change 205: the chain is a jail option; the default action passes chain="%(chain)s" and would
# override a bracketed banaction parameter with INPUT.
banaction = iptables-allports
chain = DOCKER-USER
maxretry = 20
findtime = 5m
bantime = 30m

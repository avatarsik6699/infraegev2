[DEFAULT]
banaction = ufw
bantime = 1h
findtime = 10m
maxretry = 5
# Password SSH stays by architect decision (SPEC 7.1); repeat offenders get longer bans instead.
bantime.increment = true
bantime.maxtime = 1w

[sshd]
enabled = true
backend = systemd
maxretry = 5

[infraege-nginx-limit]
enabled = true
backend = systemd
filter = infraege-nginx-limit
maxretry = 20
findtime = 5m
bantime = 30m

name: External production probe

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: HTTP and readiness
        run: |
          curl --fail --silent --show-error --max-time 15 https://kodumka.ru/ >/dev/null
          curl --fail --silent --show-error --max-time 15 https://kodumka.ru/health/ready |
            jq -e '.status == "ok" and (.version | length == 40)' >/dev/null
      - name: Former domain redirects with path and query
        run: |
          location=$(curl --silent --show-error --max-time 15 --output /dev/null \
            --write-out '%{http_code} %{redirect_url}' 'https://infraege.ru/ege?from=uptime')
          test "$location" = '301 https://kodumka.ru/ege?from=uptime'
      - name: TLS expires in more than 14 days
        run: |
          for domain in kodumka.ru infraege.ru; do
            expires=$(echo | openssl s_client -servername "$domain" -connect "$domain:443" 2>/dev/null |
              openssl x509 -noout -enddate | cut -d= -f2)
            test $(( $(date --date "$expires" +%s) - $(date +%s) )) -gt $((14 * 86400))
          done
      - name: Monitoring is reachable
        run: curl --fail --silent --show-error --max-time 15 https://sre.infraege.ru/health/ready >/dev/null
      # Change 194: a failed probe reaches the operator. Without the secrets the run still
      # fails visibly in GitHub and only warns that Telegram is not configured.
      - name: Notify Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z $TELEGRAM_BOT_TOKEN || -z $TELEGRAM_CHAT_ID ]]; then
            echo "::warning::Telegram secrets are not set; no alert was sent."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 15 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Кодумка: внешняя проверка не прошла. ${RUN_URL}" >/dev/null

name: Static quality

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.ref }}
  # A cancelled main run would leave its SHA without the evidence the release checkpoint needs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.2"
          cache: pnpm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.3"
          enable-cache: true
          prune-cache: true
      - name: Current-tree secrets defense in depth
        run: python3 scripts/gate.py run --group security-secrets
      - run: pnpm install --frozen-lockfile
      - name: Install ShellCheck when the runner lacks it
        run: command -v shellcheck || { sudo apt-get update && sudo apt-get install -y shellcheck; }
      - name: Python environment
        working-directory: apps/api
        run: uv sync --frozen --dev
      # One command source for CI and local gates: scripts/lib/gate/core.py.
      - name: Static quality groups
        run: >-
          python3 scripts/gate.py run --keep-going
          --group format --group python-format --group shell-lint --group tooling-lint --group web-lint
          --group web-typecheck --group content-static --group lesson-media
          --group api-lint --group api-typecheck --group host-ruff --group host-python
          --group docs-links --group api-contract

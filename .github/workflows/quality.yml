name: Static quality

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.2"
          cache: pnpm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.3"
          enable-cache: true
          prune-cache: true
      - name: Current-tree secrets defense in depth
        run: bash scripts/security-gate.sh secrets
      - run: pnpm install --frozen-lockfile
      - name: Shell maintenance static checks
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          pnpm lint:shell
      - name: Frontend static checks
        run: |
          pnpm lint
          pnpm --filter web typecheck
          node scripts/validate-content-links.mjs
          node scripts/practice-registry.mjs --check
      - name: Backend static checks
        working-directory: apps/api
        run: |
          uv sync --frozen --dev
          uv run ruff check app tests migrations
          pnpm exec pyright app tests migrations
          uv run ruff check ../../scripts/practice-local.py ../../scripts/application_db.py ../../scripts/lib/application_db ../../scripts/gate.py ../../scripts/lib/gate ../../scripts/release_checkpoint.py ../../scripts/test-account-server.py ../../scripts/tests
          pnpm exec pyright --project ../../scripts/pyrightconfig.json
      - name: Generated API contract drift
        run: pnpm api:check

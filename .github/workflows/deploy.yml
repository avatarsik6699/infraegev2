name: Deploy production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA from main whose images passed scanning
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Verify immutable main commit
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
      - name: Prepare password SSH trust
        env:
          SSH_HOST_KEY: ${{ secrets.PROD_SSH_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          test -x scripts/ssh-askpass.sh
      - name: Upload release bundle
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          INFRAEGE_SSH_PASSWORD: ${{ secrets.PROD_ROOT_PASSWORD }}
          INFRAEGE_PROD_KNOWN_HOSTS: /home/runner/.ssh/known_hosts
        run: |
          git archive --format=tar.gz --output="/tmp/infraege-$DEPLOY_SHA.tar.gz" "$DEPLOY_SHA"
          source scripts/lib/production-ssh.sh
          INFRAEGE_PROD_HOST="$PROD_HOST"
          production_ssh_init
          production_scp "/tmp/infraege-$DEPLOY_SHA.tar.gz" "root@$PROD_HOST:/root/"
      - name: Deploy and verify with rollback
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          INFRAEGE_SSH_PASSWORD: ${{ secrets.PROD_ROOT_PASSWORD }}
          INFRAEGE_PROD_KNOWN_HOSTS: /home/runner/.ssh/known_hosts
        run: |
          source scripts/lib/production-ssh.sh
          INFRAEGE_PROD_HOST="$PROD_HOST"
          production_ssh_init
          production_ssh "DEPLOY_SHA='$DEPLOY_SHA' bash -s" < scripts/deploy-remote.sh

name: Deploy production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA from main whose images passed scanning
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Verify immutable main commit
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
      - name: Prepare SSH trust
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.PROD_SSH_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/infraege
          chmod 600 ~/.ssh/infraege
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload release bundle
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          git archive --format=tar.gz --output="/tmp/infraege-$DEPLOY_SHA.tar.gz" "$DEPLOY_SHA"
          scp -i ~/.ssh/infraege -o StrictHostKeyChecking=yes "/tmp/infraege-$DEPLOY_SHA.tar.gz" "$PROD_USER@$PROD_HOST:/tmp/"
      - name: Deploy and verify with rollback
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/infraege -o StrictHostKeyChecking=yes "$PROD_USER@$PROD_HOST" "DEPLOY_SHA='$DEPLOY_SHA' bash -s" < scripts/deploy-remote.sh

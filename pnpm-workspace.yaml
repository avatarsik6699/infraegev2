packages:
  - "apps/web"

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@speed-highlight/core@2.0.0"
  # Change 229: the GHSA-27r3-jxmh-p828 fix (released 2026-10-22), architect-approved a week early
  - "body-parser@1.20.9"
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictPeerDependencies: true
engineStrict: true
nodeVersion: 22.13.0
packageManagerStrictVersion: true
verifyDepsBeforeRun: error
strictDepBuilds: true

allowBuilds:
  "esbuild@0.28.2": true

overrides:
  "tmp@<0.2.7": "0.2.7"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  "@lhci/utils>js-yaml": "3.15.2"
  "source-map-js@<1.2.2": "1.2.2"
  # Change 194: advisories in dev tooling (Lighthouse CI, build); none ships in an image.
  "brace-expansion@<1.1.20": "1.1.20"
  "brace-expansion@>=2.0.0 <2.1.6": "2.1.6"
  "brace-expansion@>=4.0.0 <5.0.11": "5.0.11"
  "basic-ftp@<6.2.1": "6.2.1"
  "proxy-addr@<2.0.8": "2.0.8"
  "compression@<1.8.2": "1.8.2"
  # Change 203: release audit 2026-10-24, dev tooling only (ESLint plugin, Lighthouse CI).
  "zod@>=4.0.0 <4.6.6": "4.6.6"
  # Change 229: GHSA-27r3-jxmh-p828 (body-parser DoS), Lighthouse CI's local server only.
  "body-parser@<1.20.9": "1.20.9"

# Change 194: extract-zip has no fixed release. It is reached only through Lighthouse CI's
# browser download (@lhci/cli → lighthouse → puppeteer), never with untrusted archives and
# never in an image. Revisit when a fix exists.
# Change 203: zod 3.x has no fixed release for GHSA-mrhx-c7xc-m3w5; it is reached only through
# Lighthouse CI (lighthouse → chromium-bidi), validates no untrusted input and never ships in an image.
auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv
    - GHSA-7pqw-9j4j-h8q3
    - GHSA-mrhx-c7xc-m3w5

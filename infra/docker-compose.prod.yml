# Production overlay for kodumka.ru. Render with scripts/render-production-config.sh.
x-journald: &journald
  driver: journald
  options:
    tag: "infraege/{{.Name}}"
    labels: "com.infraege.service,com.infraege.version"

x-runtime-labels: &runtime-labels
  com.infraege.project: infraege
  com.infraege.version: ${DEPLOY_SHA:?DEPLOY_SHA is required}

services:
  nginx:
    image: ghcr.io/avatarsik6699/infraegev2-nginx:${DEPLOY_SHA:?DEPLOY_SHA is required}
    build: !reset null
    volumes: !override
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - ${TASK_FILES_DIR:?TASK_FILES_DIR required}:/task-files:ro
    ports:
      - "80:80"
      - "443:443"
    mem_limit: 128m
    restart: always
    labels:
      <<: *runtime-labels
      com.infraege.service: nginx
    logging: *journald

  web:
    image: ghcr.io/avatarsik6699/infraegev2-web:${DEPLOY_SHA:?DEPLOY_SHA is required}
    build: !reset null
    environment:
      DEPLOY_SHA: ${DEPLOY_SHA}
    mem_limit: 512m
    restart: always
    labels:
      <<: *runtime-labels
      com.infraege.service: web
    logging: *journald

  api:
    image: ghcr.io/avatarsik6699/infraegev2-api:${DEPLOY_SHA:?DEPLOY_SHA is required}
    build: !reset null
    environment:
      APP_ENV: production
      DEPLOY_SHA: ${DEPLOY_SHA}
    volumes: !override
      - ${TASK_FILES_DIR:?TASK_FILES_DIR required}:/task-files:ro
      - ${GEOIP_DIR:?GEOIP_DIR required}:/geoip:ro
    mem_limit: 384m
    restart: always
    labels:
      <<: *runtime-labels
      com.infraege.service: api
    logging: *journald

  db-migrate:
    image: ghcr.io/avatarsik6699/infraegev2-api:${DEPLOY_SHA:?DEPLOY_SHA is required}
    build: !reset null
    command:
      - .venv/bin/alembic upgrade head
    mem_limit: 384m
    logging: *journald

  postgres:
    mem_limit: 640m
    restart: always
    # Change 229: nothing here changes with a release, so a deploy keeps the database running;
    # only a new image or a real configuration change recreates it. The release a database
    # belongs to is /opt/infraege/database-current (backups read it), not a container label.
    labels:
      com.infraege.project: infraege
      com.infraege.service: postgres
    volumes: !override
      - postgres122-data:/var/lib/postgresql
      # initdb only; installed by deploy-remote.sh outside the release directory
      - /opt/infraege/shared/db-provision-roles.sh:/docker-entrypoint-initdb.d/10-application-roles.sh:ro
      - ${TASK_FILES_DIR:?TASK_FILES_DIR is required}:/task-files:ro
    logging: *journald

# Production overlay for infraege.ru. Render with scripts/render-production-config.sh.
x-journald: &journald
  driver: journald
  options:
    tag: "infraege/{{.Name}}"
    labels: "com.infraege.service,com.infraege.version"

x-runtime-labels: &runtime-labels
  com.infraege.project: infraege
  com.infraege.version: ${DEPLOY_SHA:?DEPLOY_SHA is required}

services:
  nginx:
    image: ghcr.io/avatarsik6699/infraegev2-nginx:${DEPLOY_SHA:?DEPLOY_SHA is required}
    build: !reset null
    volumes: !override
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    mem_limit: 128m
    restart: always
    labels:
      <<: *runtime-labels
      com.infraege.service: nginx
    logging: *journald
    networks:
      - default
      - observability-ingress

  web:
    image: ghcr.io/avatarsik6699/infraegev2-web:${DEPLOY_SHA:?DEPLOY_SHA is required}
    build: !reset null
    environment:
      DEPLOY_SHA: ${DEPLOY_SHA}
    mem_limit: 512m
    restart: always
    labels:
      <<: *runtime-labels
      com.infraege.service: web
    logging: *journald

  api:
    image: ghcr.io/avatarsik6699/infraegev2-api:${DEPLOY_SHA:?DEPLOY_SHA is required}
    build: !reset null
    environment:
      APP_ENV: production
      DEPLOY_SHA: ${DEPLOY_SHA}
    mem_limit: 384m
    restart: always
    labels:
      <<: *runtime-labels
      com.infraege.service: api
    logging: *journald

  postgres:
    mem_limit: 640m
    restart: always
    labels:
      <<: *runtime-labels
      com.infraege.service: postgres
    logging: *journald

networks:
  observability-ingress:
    external: true
    name: infraege-observability-ingress

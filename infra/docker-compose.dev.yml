# One-command developer overlay used by `make dev`.
# Dependencies are installed inside images; source bind mounts provide hot reload without
# requiring Node, pnpm, Python, uv, PostgreSQL, or an .env file on the host.
services:
  nginx:
    ports:
      - "8080:80"
    # The upstream image uses SIGQUIT for graceful shutdown. Open Vite HMR WebSockets can keep
    # that drain alive until Compose sends SIGKILL, making `make stop` appear hung. Local
    # development has no traffic to drain, so terminate nginx promptly; production keeps the
    # image's graceful signal from the base Compose file.
    stop_signal: SIGTERM
    healthcheck:
      interval: 2s
      timeout: 2s
      retries: 30

  web:
    build:
      target: development
    environment:
      - NODE_ENV=development
      - VITE_PROXY_TARGET=http://api:8000
    volumes:
      - ../apps/web/src:/repo/apps/web/src
      - ../apps/web/public:/repo/apps/web/public
      - ../content/tasks:/content/tasks:ro
    healthcheck:
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  api:
    environment:
      - APP_ENV=development
    volumes:
      - ../apps/api/app:/app/app
      - ../content/tasks:/content/tasks:ro
    healthcheck:
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  postgres:
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      interval: 2s
      timeout: 2s
      retries: 30

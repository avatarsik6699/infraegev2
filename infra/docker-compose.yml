# Topology per docs/SPEC.md §7.1. `web` runs the TanStack Start Node server (Nitro); the root
# foundation route is prerendered and remains readable without JavaScript.
x-json-file-logging: &json-file-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  nginx:
    image: nginx:1.31.0-alpine@sha256:2f07d83bf561b506400dc183b1b2003803e39efbd22451f848adaba14d28c7c7
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/auxiliary:/usr/share/nginx/auxiliary:ro
      - ../apps/web/public/brand/infraege-mark.svg:/usr/share/nginx/auxiliary/assets/infraege-mark.svg:ro
      - ../apps/web/public/fonts:/usr/share/nginx/auxiliary/assets/fonts:ro
      - ./nginx/conf.d/infraege.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TASK_FILES_DIR:-./task-files.local}:/task-files:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    <<: *json-file-logging

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      - API_INTERNAL_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode >= 200 && r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    <<: *json-file-logging

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DATABASE_URL=postgresql://infraege_runtime:${DB_RUNTIME_PASSWORD:?DB_RUNTIME_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-infraege}
      - DEPLOY_SHA=${DEPLOY_SHA:-development}
      - TASK_FILES_DIR=/task-files
    volumes:
      - ${TASK_FILES_DIR:-./task-files.local}:/task-files:ro
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Not exposed to the host — Nginx reaches it over the internal docker network.
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    <<: *json-file-logging

  db-migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      - MIGRATION_DATABASE_URL=postgresql://infraege_migration:${DB_MIGRATION_PASSWORD:?DB_MIGRATION_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-infraege}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - uv run --frozen alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    <<: *json-file-logging

  postgres:
    image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-infraege}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-infraege}
      - PGDATA=/var/lib/postgresql/18/docker
      - DEPLOY_SHA=${DEPLOY_SHA:-development}
      - DB_RUNTIME_PASSWORD=${DB_RUNTIME_PASSWORD:?DB_RUNTIME_PASSWORD is required}
      - DB_IMPORT_PASSWORD=${DB_IMPORT_PASSWORD:?DB_IMPORT_PASSWORD is required}
      - DB_MIGRATION_PASSWORD=${DB_MIGRATION_PASSWORD:?DB_MIGRATION_PASSWORD is required}
      - DB_BACKUP_PASSWORD=${DB_BACKUP_PASSWORD:?DB_BACKUP_PASSWORD is required}
    volumes:
      - postgres122-data:/var/lib/postgresql
      - ../scripts/db-provision-roles.sh:/docker-entrypoint-initdb.d/10-application-roles.sh:ro
      - ${TASK_FILES_DIR:-./task-files.local}:/task-files:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infraege}"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *json-file-logging

volumes:
  postgres122-data:

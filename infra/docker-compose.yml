# Topology per docs/SPEC.md §7.1. `web` runs the TanStack Start Node server (Nitro); the root
# foundation route is prerendered and remains readable without JavaScript.
x-json-file-logging: &json-file-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  nginx:
    image: nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/infraege.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    <<: *json-file-logging

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      - CONTENT_DIR=/content
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode >= 200 && r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    <<: *json-file-logging

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-infraege}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-infraege}
      - DEPLOY_SHA=${DEPLOY_SHA:-development}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Not exposed to the host — Nginx reaches it over the internal docker network.
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    <<: *json-file-logging

  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-infraege}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-infraege}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infraege}"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *json-file-logging

volumes:
  postgres-data:

# Local-dev overrides, merged automatically by `docker compose` on top of docker-compose.yml
# (SPEC.md §7.1/§7.2 — same compose file locally and on the VPS, only overrides differ).
#
# Must NOT exist on a production host — Compose auto-loads any file with this exact name, which
# would silently republish these ports and flip APP_ENV back to development.
services:
  nginx:
    ports:
      - "18080:80"

  web:
    ports:
      - "13000:3000"

  api:
    ports:
      - "18000:8000"
    environment:
      # apps/api/entrypoint.sh reads this to decide whether to pass --reload to uvicorn.
      - APP_ENV=development

  postgres:
    ports:
      - "15432:5432"

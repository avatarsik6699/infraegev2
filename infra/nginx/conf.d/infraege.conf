map $http_upgrade $connection_upgrade {
  default close;
  ~*^websocket$ upgrade;
}

server {
  listen 80;
  server_name _;

  # Long-lived caching for hashed build assets (SPEC.md §7.1 CDN origin-pull section) — Nitro
  # serves these itself. Production adds the immutable cache policy at the Nginx edge; local
  # Compose keeps the upstream response unchanged.
  location /_build/ {
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
  }

  location /api/tasks/ {
    limit_req zone=checker burst=5 nodelay;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Uptime Kuma / deploy-verification target (docs/SPEC.md §7.2/§12) — deliberately outside
  # /api/ so external monitoring doesn't share the checker endpoint's rate limit.
  location = /health {
    proxy_pass http://api:8000/health;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://web:3000;
    # Vite HMR uses a WebSocket at the application root in the development target. These headers
    # are harmless for normal production HTTP requests and keep the shared Nginx entrypoint
    # faithful to the developer server instead of triggering Vite's unreachable :3000 fallback.
    # The generic Semgrep rule flags every WebSocket proxy triple without inspecting values;
    # `$connection_upgrade` permits only an exact websocket request and rejects h2c with `close`.
    # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
    proxy_http_version 1.1;
    proxy_set_header Upgrade websocket;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

server {
  listen 80;
  server_name infraege.ru www.infraege.ru;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location / {
    return 308 https://infraege.ru$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.infraege.ru;

  ssl_certificate /etc/letsencrypt/live/infraege.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/infraege.ru/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  return 308 https://infraege.ru$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name infraege.ru;

  ssl_certificate /etc/letsencrypt/live/infraege.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/infraege.ru/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache shared:TLS:10m;

  server_tokens off;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  access_log /dev/stdout combined;
  error_log /dev/stderr warn;
  # Docker's embedded DNS keeps the independently deployed Umami endpoint replaceable and lets
  # Nginx start during the short cutover interval before the operations project is healthy.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $umami_origin http://umami:3000;

  location /_build/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
  }

  location /api/tasks/ {
    limit_req zone=checker burst=5 nodelay;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    add_header Cache-Control "no-store" always;
  }

  location = /api/client-errors {
    client_max_body_size 4k;
    limit_req zone=client_errors burst=5 nodelay;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    add_header Cache-Control "no-store" always;
  }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    add_header Cache-Control "no-store" always;
  }

  location ~ ^/health(?:/live|/ready)?$ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
  }

  location = /stats/script.js {
    proxy_pass $umami_origin/script.js;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=3600";
  }

  location = /stats/api/send {
    limit_req zone=analytics burst=20 nodelay;
    proxy_pass $umami_origin/stats/api/send;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    add_header Cache-Control "no-store" always;
  }

  location ^~ /stats/ {
    return 404;
  }

  location / {
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;
  }
}

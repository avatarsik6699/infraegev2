server {
  listen 80;
  server_name infraege.ru www.infraege.ru;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location / {
    return 308 https://infraege.ru$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.infraege.ru;

  ssl_certificate /etc/letsencrypt/live/infraege.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/infraege.ru/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  return 308 https://infraege.ru$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name infraege.ru;

  ssl_certificate /etc/letsencrypt/live/infraege.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/infraege.ru/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache shared:TLS:10m;

  server_tokens off;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://sre.infraege.ru; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://sre.infraege.ru; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  # `$uri`, unlike `$request_uri`, excludes callback code/state and other query credentials.
  access_log /dev/stdout privacy;
  error_log /dev/stderr warn;
  # Immutable JS bundles and fonts reach ~250 KiB; the default 8 × 4/8k buffers spilled them to
  # proxy_temp on every slow client. Buffers are allocated only as a response needs them.
  proxy_buffers 16 32k;
  proxy_busy_buffers_size 64k;
  location /_build/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
  }

  location ^~ /fonts/ {
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=604800" always;
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
  }

  location ~ ^/api/tasks/[^/]+/check-and-save$ {
    limit_req zone=auth_requests burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    add_header Cache-Control "no-store" always;
  }

  location ~ ^/api/tasks/[^/]+/check$ {
    limit_req zone=checker burst=5 nodelay;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    add_header Cache-Control "no-store" always;
  }

  location ~ ^/api/auth/providers/(vk|yandex|telegram)/callback$ {
    limit_req zone=auth_requests burst=10 nodelay;
    limit_req_status 429;
    # Do not retain provider callback query credentials at the edge. API structured logs record
    # only the path; Uvicorn access logs are disabled by its entrypoint.
    access_log off;
    # Lower-level proxy errors include a raw request line, so retain only critical diagnostics here.
    error_log /dev/stderr crit;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    add_header Cache-Control "no-store" always;
  }

  location /api/auth/ {
    limit_req zone=auth_requests burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    add_header Cache-Control "no-store" always;
  }

  location ~ ^/api/(tasks(?:/|$)|task-sitemap(?:-index)?$) {
    include /etc/nginx/snippets/practice-read-limit.conf;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }


  location /_task-files/ {
    internal;
    alias /task-files/;
    disable_symlinks on;
    add_header X-Content-Type-Options nosniff always;
  }

  location /api/ {
    include /etc/nginx/snippets/practice-read-limit.conf;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    add_header Cache-Control "no-store" always;
  }

  location ~ ^/health(?:/live|/ready)?$ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
  }




  include /etc/nginx/snippets/auxiliary-locations.conf;

  location / {
    include /etc/nginx/snippets/auxiliary-proxy.conf;
    include /etc/nginx/snippets/practice-read-limit.conf;
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;
  }
}

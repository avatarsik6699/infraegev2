# Classify once in the original proxy location, before error_page changes the method.
map "$request_method:$http_sec_fetch_dest:$http_accept" $auxiliary_html_request {
  default 0;
  ~*^(GET|HEAD):(document|iframe): 1;
  ~*^(GET|HEAD)::.*text/html 1;
}
map $request_uri $auxiliary_page_path {
  default 1;
  ~^/(api|health|stats|_build|_server|_serverFn|__server|@|src|node_modules|images|fonts|brand|_infraege) 0;
  ~*\.(js|mjs|css|map|json|png|jpe?g|webp|svg|ico|woff2?|ttf|pdf|zip|txt|xml)(\?|$) 0;
}
map "$auxiliary_html_request:$auxiliary_page_path" $auxiliary_is_document {
  default 0;
  "1:1" 1;
}
map $https $auxiliary_hsts {
  default "";
  on "max-age=31536000";
}

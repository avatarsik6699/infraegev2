# Lesson videos and posters are baked into this image and served by Nginx itself: video playback
# needs HTTP Range (206) responses, which the Node application server does not provide.
location ^~ /lesson-media/ {
  alias /usr/share/nginx/lesson-media/;
  disable_symlinks on;
  try_files $uri =404;
  # A location with its own add_header drops the server-level ones; media needs only these two.
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  # File names are not content-hashed: a regenerated clip must reach visitors within a day.
  add_header Cache-Control "public, max-age=86400" always;
}

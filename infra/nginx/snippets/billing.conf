# Change 192 (SPEC §6.1, §7.3): paid lesson chunks are served only after the API confirms
# the viewer's access; the session cookie travels with the internal subrequest. While the
# paywall flag is off the check always answers 204.
location ^~ /assets/paid/ {
  auth_request /_entitlement;
  include /etc/nginx/snippets/practice-read-limit.conf;
  proxy_pass http://web:3000;
  proxy_set_header Host $host;
  proxy_set_header X-Request-ID $request_id;
  # never cache a gated chunk in a shared cache or past the viewer's access
  proxy_hide_header Cache-Control;
  add_header Cache-Control "private, no-store" always;
}

location = /_entitlement {
  internal;
  proxy_pass http://api:8000/api/access/asset;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Host $host;
  proxy_set_header X-Request-ID $request_id;
}

# Provider notifications: small bodies, their own budget; the signature authenticates them.
location ~ ^/api/billing/webhooks/[a-z]+$ {
  limit_req zone=billing_webhooks burst=20 nodelay;
  limit_req_status 429;
  client_max_body_size 32k;
  proxy_pass http://api:8000;
  proxy_set_header Host $host;
  proxy_set_header X-Request-ID $request_id;
  add_header Cache-Control "no-store" always;
}

location = /api/billing/checkout {
  limit_req zone=auth_requests burst=10 nodelay;
  limit_req_status 429;
  client_max_body_size 4k;
  proxy_pass http://api:8000;
  proxy_set_header Host $host;
  proxy_set_header X-Request-ID $request_id;
  add_header Cache-Control "no-store" always;
}

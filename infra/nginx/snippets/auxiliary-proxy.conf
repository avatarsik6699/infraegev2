set $auxiliary_document $auxiliary_is_document;
proxy_intercept_errors on;
# Without a matching error_page, non-document upstream responses pass through intact.
if ($auxiliary_document = 1) {
  error_page 502 =502 @auxiliary_502;
  error_page 503 =503 @auxiliary_503;
  error_page 504 =504 @auxiliary_504;
}

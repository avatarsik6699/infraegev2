# One ingress budget for direct reads and their SSR/server-function equivalents.
# Empty keys keep static assets, unrelated pages and health outside this budget.
map $uri $practice_read_key {
  default "";
  ~^/api/(tasks(?:/|$)|task-sitemap(?:-index)?$|learning-materials/|courses/|topics/practice-summary$) $binary_remote_addr;
  ~^/(practice(?:/|$)|_serverFn(?:/|$)) $binary_remote_addr;
}
limit_req_zone $practice_read_key zone=practice_reads:10m rate=120r/m;

# Change 194: lesson pages and sitemaps are what search crawlers walk during a site move;
# they get a wider budget of their own instead of sharing the practice-read one.
map $uri $page_read_key {
  default "";
  ~^/(ege/|courses(?:/|$)|sitemap\.xml$|sitemap-static\.xml$|sitemap-practice/) $binary_remote_addr;
}
limit_req_zone $page_read_key zone=page_reads:10m rate=600r/m;

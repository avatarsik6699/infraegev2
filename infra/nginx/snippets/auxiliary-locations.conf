# These files and assets are served by Nginx even when web is unavailable.
location ^~ /_infraege/ {
  alias /usr/share/nginx/auxiliary/assets/;
  include /etc/nginx/snippets/auxiliary-security.conf;
  add_header Cache-Control "public, max-age=0, must-revalidate" always;
}

location @auxiliary_502 {
  if ($auxiliary_document != 1) { return 502; }
  root /usr/share/nginx/auxiliary;
  default_type text/html;
  try_files /502.html =502;
  include /etc/nginx/snippets/auxiliary-security.conf;
  add_header Cache-Control "no-store" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
}

location @auxiliary_503 {
  if ($auxiliary_document != 1) { return 503; }

user nginx;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # SPEC.md §4/§8: rate-limit the public checker endpoint against automated answer scraping.
  # Starting point — the architect explicitly flagged this rate to revisit against real logs
  # after launch (SPEC.md §11), not to treat as final. Must live inside `http{}` — this directive
  # is invalid at the top level (a change-01 bug fixed in change 02).
  include /etc/nginx/snippets/practice-read-zone.conf;
  limit_req_zone $binary_remote_addr zone=checker:10m rate=20r/m;
  # Auth mutations and provider redirects have their own bounded budget. Provider callback
  # query strings carry one-time secrets, so those locations disable edge access logging.
  limit_req_zone $binary_remote_addr zone=auth_requests:10m rate=10r/m;

  # Never log a raw request target: OAuth callback code/state and email-verification tokens may
  # appear in a query string. `$uri` is normalized and deliberately excludes arguments; omit
  # Referer too because same-origin browser requests can carry a verification-link query there.
  log_format privacy '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                     '"$http_user_agent"';

  resolver 127.0.0.11 valid=10s ipv6=off;

  include /etc/nginx/snippets/auxiliary-maps.conf;
  include conf.d/*.conf;
}

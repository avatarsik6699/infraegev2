# SPEC.md §4 / §8: rate-limit the public checker endpoint against automated answer scraping.
# Starting point — the architect explicitly flagged this rate to revisit against real logs
# after launch (SPEC.md §11), not to treat as final.
limit_req_zone $binary_remote_addr zone=checker:10m rate=20r/m;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  server {
    listen 80;
    server_name _;

    # Long-lived caching for hashed build assets (SPEC.md §7.1 CDN origin-pull section) — Nitro
    # serves these itself, Nginx only adds the cache header on the way through.
    location /_build/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
    }

    location /api/tasks/ {
      limit_req zone=checker burst=5 nodelay;
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Uptime Kuma / deploy-verification target (docs/SPEC.md §7.2/§12) — deliberately outside
    # /api/ so external monitoring doesn't share the checker endpoint's rate limit.
    location = /health {
      proxy_pass http://api:8000/health;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
